name: build

# Since 0.4.0, the only release artifact is msm_drm_drv_video.so.
# The driver opens /dev/video32 directly from the container. In 0.3.x,
# an Android MediaCodec daemon and its KSU watchdog were also distributed.
# Build in an aarch64 QEMU container because the x86_64 cross toolchain lacks
# the aarch64 glibc needed by the driver. See vaapi-driver/Makefile.
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  driver:
    name: msm_drm_drv_video.so (native aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable aarch64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Debian trixie matches the container this driver actually runs in, so the
      # libva and libdrm headers here are the ones it will be loaded against.
      - name: Build in aarch64 Debian trixie
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" -w /src/vaapi-driver \
            debian:trixie-slim bash -euxc '
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                build-essential pkg-config libva-dev libdrm-dev
              make clean
              make all
              make check
              make tests
            '

      - name: Verify it is an aarch64 shared object
        run: |
          file vaapi-driver/build/msm_drm_drv_video.so
          file vaapi-driver/build/msm_drm_drv_video.so | grep -q 'ARM aarch64' || {
            echo "not an aarch64 shared object" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: msm_drm_drv_video.so
          path: vaapi-driver/build/msm_drm_drv_video.so
          if-no-files-found: error

  release:
    name: Release
    needs: [ driver ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the per-component diff below needs the previous
      # tag, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum msm_drm_drv_video.so > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes for this tag
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          # Pull just this version's section out of the changelog.
          awk -v want="## ${tag}" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG section for ${tag}" >&2
            exit 1
          fi
          wc -l notes.md

      # A rebuild on a different toolchain changes the binary's checksum with no
      # source change at all, which looks like a silent code change. Say whether
      # the source tree moved and pin the compiler, so a changed checksum is
      # always explainable.
      - name: Describe what changed
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo
            echo '### Scope of changes'
            echo
            if [ -n "$prev" ]; then
              echo "Compared with \`${prev}\`:"
              echo
              driver_changed=$(git diff --name-only "${prev}..${GITHUB_REF_NAME}" -- vaapi-driver/src/ | wc -l)
              if [ "$driver_changed" -gt 0 ]; then
                echo "- **\`msm_drm_drv_video.so\`** changed (${driver_changed} files under \`vaapi-driver/src/\`)."
                git diff --stat "${prev}..${GITHUB_REF_NAME}" -- vaapi-driver/src/ | sed 's/^/      /'
              else
                echo "- **\`msm_drm_drv_video.so\`** source is unchanged."
                echo "  The checksum may differ because CI rebuilt the driver."
              fi
            else
              echo "No previous tag is available for comparison."
            fi
            echo
            echo '### Build environment'
            echo '| Artifact | Toolchain |'
            echo '|---|---|'
            echo "| \`msm_drm_drv_video.so\` | Debian trixie aarch64, system GCC |"
            echo
            echo '> A toolchain change can alter the binary checksum. See the source diff above for code changes.'
            echo
            echo '### Install'
            echo
            echo 'Since 0.4.0, install only the driver in the container.'
            echo
            echo '```sh'
            echo 'install -m 0644 msm_drm_drv_video.so \'
            echo '  /usr/lib/aarch64-linux-gnu/dri/msm_drm_drv_video.so'
            echo '```'
            echo
            echo 'Install `libva2` and `libva-drm2` in the container and verify that the user belongs to the `droidspaces-gpu` group.'
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/msm_drm_drv_video.so
            dist/SHA256SUMS
          body_path: notes.md
          fail_on_unmatched_files: true
