name: build

# 0.4.0 起只有一个产物：msm_drm_drv_video.so
#
# 0.3.x 曾有三个（decode-daemon / 驱动 / dmd_watchdog 模块 zip），因为解码是
# 在 Android 侧用 MediaCodec 做的，需要一个常驻 daemon 和一个看护它的 KSU 模块。
# 改成驱动内 V4L2 直通后，解码全程在容器进程内完成（libva 驱动直连
# /dev/video32），Android 侧不再有本项目的任何可执行文件 —— daemon job 与
# watchdog job 一并删除。
#
# 驱动必须在 aarch64 上编（vaapi-driver/Makefile 顶部有说明：x86_64 交叉
# 工具链缺 aarch64 glibc），所以走 QEMU 容器。
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  driver:
    name: msm_drm_drv_video.so (native aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable aarch64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Debian trixie matches the container this driver actually runs in, so the
      # libva and libdrm headers here are the ones it will be loaded against.
      - name: Build in aarch64 Debian trixie
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" -w /src/vaapi-driver \
            debian:trixie-slim bash -euxc '
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                build-essential pkg-config libva-dev libdrm-dev
              make clean
              make all
              make check
              make tests
            '

      - name: Verify it is an aarch64 shared object
        run: |
          file vaapi-driver/build/msm_drm_drv_video.so
          file vaapi-driver/build/msm_drm_drv_video.so | grep -q 'ARM aarch64' || {
            echo "not an aarch64 shared object" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: msm_drm_drv_video.so
          path: vaapi-driver/build/msm_drm_drv_video.so
          if-no-files-found: error

  release:
    name: Release
    needs: [ driver ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the per-component diff below needs the previous
      # tag, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum msm_drm_drv_video.so > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes for this tag
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          # Pull just this version's section out of the changelog.
          awk -v want="## ${tag}" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG section for ${tag}" >&2
            exit 1
          fi
          wc -l notes.md

      # A rebuild on a different toolchain changes the binary's checksum with no
      # source change at all, which looks like a silent code change. Say whether
      # the source tree moved and pin the compiler, so a changed checksum is
      # always explainable.
      - name: Describe what changed
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo
            echo '### 本次改动范围'
            echo
            if [ -n "$prev" ]; then
              echo "与 \`${prev}\` 相比："
              echo
              driver_changed=$(git diff --name-only "${prev}..${GITHUB_REF_NAME}" -- vaapi-driver/src/ | wc -l)
              if [ "$driver_changed" -gt 0 ]; then
                echo "- **\`msm_drm_drv_video.so\`**：源码有改动（\`vaapi-driver/src/\` 下 ${driver_changed} 个文件）"
                git diff --stat "${prev}..${GITHUB_REF_NAME}" -- vaapi-driver/src/ | sed 's/^/      /'
              else
                echo "- **\`msm_drm_drv_video.so\`**：**源码无改动**（\`vaapi-driver/src/\` 零变更）。"
                echo "  二进制的 checksum 仍可能与上一版不同，因为它是在 CI 上重新编译的。"
                echo "  行为未变。"
              fi
            else
              echo "首个带此说明的版本，无法与上一 tag 比较。"
            fi
            echo
            echo '### 构建环境'
            echo
            echo '| 产物 | 工具链 |'
            echo '|---|---|'
            echo "| \`msm_drm_drv_video.so\` | Debian trixie aarch64，系统 gcc |"
            echo
            echo '> 换工具链会改变二进制的 checksum，即使源码一字未动。要判断是否真有'
            echo '> 代码改动，看上面的「改动范围」而不是 checksum。'
            echo
            echo '### 安装'
            echo
            echo '⚠️ 0.4.0 起**不需要任何 Android 侧部署** —— 没有 daemon、没有'
            echo '看护模块、没有 socket。只需把驱动放进容器：'
            echo
            echo '```sh'
            echo 'install -m 0644 msm_drm_drv_video.so \'
            echo '  /usr/lib/aarch64-linux-gnu/dri/msm_drm_drv_video.so'
            echo '```'
            echo
            echo '前提：容器内有 `libva2`、`libva-drm2`，且容器用户在'
            echo '`droidspaces-gpu` 组内（平台侧通常已代为加组）。'
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/msm_drm_drv_video.so
            dist/SHA256SUMS
          body_path: notes.md
          fail_on_unmatched_files: true
