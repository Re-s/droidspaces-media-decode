<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playback tracker</title>
<style>
  body { background:#111; color:#ddd; font-family:monospace; margin:0; padding:8px; }
  video { width:700px; max-width:100%; background:#000; display:block; }
  #hud { font-size:14px; line-height:1.6; padding:6px 0; }
  #tl { font-size:12px; line-height:1.5; white-space:pre; }
  b { color:#7fd; } .bad { color:#f66; } .ok { color:#6f6; }
</style>
</head>
<body>
<video id="v" muted playsinline></video>
<div id="hud">Tracking…</div>
<div id="tl"></div>

<script>
/* Sample playback quality once a second. In testing, requestVideoFrameCallback
 * fired only 241 times for 610 presented frames. Counting the callbacks yielded
 * a false 12 fps reading, and timing them suggested 58% stutter.
 *
 * Use differences in the cumulative getVideoPlaybackQuality() counters for the
 * number of decoded and dropped frames. Check video.currentTime separately to
 * see whether playback is advancing at the expected rate.
 *
 * This helps establish whether a jump from 5 to 140 dropped frames under the
 * same configuration is sustained or confined to a brief interval.
 */
const q = new URLSearchParams(location.search);
const secs = parseInt(q.get('secs') || '30', 10);
const file = q.get('f') || 'h264_long.mp4';
const nominal = parseFloat(q.get('fps') || '30');

const v = document.getElementById('v');
const hud = document.getElementById('hud');
const tl = document.getElementById('tl');
v.src = file;
v.loop = false;

const rows = [];
let prev = null, t0 = null, timer = null, reported = false;

function sample() {
  const qq = v.getVideoPlaybackQuality();
  const now = performance.now();
  const ct = v.currentTime;

  if (prev === null) {
    t0 = now;
    prev = { t: now, total: qq.totalVideoFrames, drop: qq.droppedVideoFrames, ct: ct };
    return;
  }

  const dt = (now - prev.t) / 1000;
  const dTotal = qq.totalVideoFrames - prev.total;
  const dDrop = qq.droppedVideoFrames - prev.drop;
  const dCt = ct - prev.ct;
  const el = (now - t0) / 1000;

  rows.push({
    at: +el.toFixed(1),
    decoded: dTotal, dropped: dDrop,
    fps: +(dTotal / dt).toFixed(1),
    /* Media time rate. At 1.0, playback keeps up with wall-clock time. */
    rate: +(dCt / dt).toFixed(3)
  });

  prev = { t: now, total: qq.totalVideoFrames, drop: qq.droppedVideoFrames, ct: ct };

  /* Show one timeline row per second and highlight drops. */
  tl.innerHTML = rows.slice(-24).map(function (r) {
    const bad = r.dropped > nominal * 0.05 || r.rate < 0.9;
    const mark = bad ? '<span class="bad">' : '<span class="ok">';
    return mark + ('  ' + r.at).slice(-5) + 's  decoded ' + ('  ' + r.decoded).slice(-3) +
           '  dropped ' + ('  ' + r.dropped).slice(-3) +
           '  ' + ('    ' + r.fps.toFixed(1)).slice(-5) + 'fps' +
           '  rate ×' + r.rate.toFixed(2) + '</span>';
  }).join('\n');

  const sumD = rows.reduce(function (a, r) { return a + r.decoded; }, 0);
  const sumX = rows.reduce(function (a, r) { return a + r.dropped; }, 0);
  const badSecs = rows.filter(function (r) {
    return r.dropped > nominal * 0.05 || r.rate < 0.9;
  }).length;

  hud.innerHTML =
    'Measured <b>' + el.toFixed(0) + '</b>/' + secs + 's　' +
    'Decoded <b>' + sumD + '</b>　Dropped <b class="' + (sumX > sumD * 0.05 ? 'bad' : 'ok') +
      '">' + sumX + '</b> (' + (sumD ? (100 * sumX / sumD).toFixed(2) : 0) + '%)<br>' +
    'Average <b>' + (sumD / el).toFixed(2) + '</b> fps (nominal ' + nominal + ')　' +
    'Seconds with stutter or drops <b class="' + (badSecs ? 'bad' : 'ok') + '">' + badSecs + '</b>/' + rows.length;

  if (el >= secs && !reported) {
    reported = true;
    clearInterval(timer);
    fetch('http://127.0.0.1:8931/result', {
      method: 'POST',
      body: JSON.stringify({
        file: file, secs: +el.toFixed(1),
        decoded: sumD, dropped: sumX,
        drop_pct: sumD ? +(100 * sumX / sumD).toFixed(2) : 0,
        avg_fps: +(sumD / el).toFixed(2),
        bad_secs: badSecs, n_secs: rows.length,
        timeline: rows
      })
    }).catch(function () {});
  }
}

v.addEventListener('loadedmetadata', function () {
  v.play().then(function () { timer = setInterval(sample, 1000); sample(); })
          .catch(function (e) { hud.textContent = 'Playback failed: ' + e; });
});
v.addEventListener('error', function () { hud.textContent = 'Cannot load: ' + file; });
</script>
</body>
</html>
